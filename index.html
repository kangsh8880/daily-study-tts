<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>TTS</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#1a1a2e;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Malgun Gothic',Arial,sans-serif;}
    .card{background:#16213e;border-radius:18px;padding:28px 24px;text-align:center;max-width:340px;width:92%;box-shadow:0 8px 32px rgba(0,0,0,0.4);}
    .lang-badge{display:inline-block;padding:3px 12px;border-radius:20px;font-size:12px;font-weight:700;margin-bottom:14px;}
    .text-box{font-size:20px;color:#e8e8e8;margin:10px 0 4px;line-height:1.5;word-break:break-all;min-height:40px;}
    .pron-eng{font-size:15px;color:#ffffff;font-weight:600;margin-bottom:6px;min-height:20px;letter-spacing:0.5px;}
    .pron{font-size:12px;color:#8899AA;margin-bottom:16px;min-height:16px;}
    .btn{background:#0f3460;color:#fff;border:none;border-radius:12px;padding:13px 32px;font-size:15px;cursor:pointer;width:100%;transition:background 0.2s;}
    .btn:active{background:#1a5276;}
    .status{font-size:12px;margin-top:12px;height:18px;}
    .ok{color:#4CAF50;} .err{color:#EF5350;} .ing{color:#FFA726;}
  </style>
</head>
<body>
<div class="card">
  <div class="lang-badge" id="badge"></div>
  <div class="text-box" id="textDisplay"></div>
  <div class="pron-eng" id="pronEngDisplay"></div>
  <div class="pron" id="pronDisplay"></div>
  <button class="btn" id="playBtn" onclick="playNow(true)">&#9654; 발음 듣기</button>
  <div class="status" id="status"></div>
</div>
<script>
var p = new URLSearchParams(location.search);
var rawText  = p.get('text') || '';
var lang     = p.get('lang') || 'ko';
var auto     = p.get('auto') === '1';
var proxyUrl = p.get('proxy') || '';
var rawPron  = p.get('pron') || '';  // 영어 발음 표기 (그룹B)
var ttsRate  = parseFloat(p.get('rate') || '0');  // 재생 속도 (0이면 기본값 사용)

var decoded = '';
try { decoded = decodeURIComponent(rawText); } catch(e){ decoded = rawText; }

var pronEng = '';
try { pronEng = rawPron ? decodeURIComponent(rawPron) : ''; } catch(e){ pronEng = rawPron; }

// 발음용: 괄호 안 텍스트 제거
var cleaned = decoded.replace(/\([^)]*\)/g, '').replace(/\s{2,}/g, ' ').trim();

var META = {
  ko: {name:'한국어', full:'ko-KR', color:'#3F51B5', bg:'#E8EAF6'},
  vi: {name:'베트남어', full:'vi-VN', color:'#4CAF50', bg:'#E8F5E9'},
  en: {name:'영어',    full:'en-US', color:'#FF9800', bg:'#FFF3E0'},
  zh: {name:'중국어',  full:'zh-CN', color:'#F44336', bg:'#FFEBEE'},
  ja: {name:'일본어',  full:'ja-JP', color:'#9C27B0', bg:'#F3E5F5'}
};
var m = META[lang] || META.ko;

var badge = document.getElementById('badge');
badge.textContent = m.name;
badge.style.background = m.bg;
badge.style.color = m.color;

// 원문 표시
document.getElementById('textDisplay').textContent = decoded;

// 영어 발음 표기 표시 (그룹B에서만 전달됨) - 항상 흰색
var pronEngEl = document.getElementById('pronEngDisplay');
pronEngEl.textContent = pronEng ? '(' + pronEng + ')' : '';

function setStatus(msg, cls){
  var el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status ' + (cls||'');
}

function getBestVoice(fullLang, shortLang) {
  var voices = speechSynthesis.getVoices();

  if (shortLang === 'zh') {
    for(var i=0;i<voices.length;i++){
      var v=voices[i];
      if((v.lang==='zh-CN'||v.lang==='zh') && v.name.indexOf('Google')>=0) return v;
    }
    for(var i=0;i<voices.length;i++){
      var v=voices[i];
      if(v.lang==='zh-CN') return v;
    }
    for(var i=0;i<voices.length;i++){
      var v=voices[i];
      if(v.lang.indexOf('zh')>=0 && v.lang.indexOf('TW')<0) return v;
    }
    return null;
  }

  if (shortLang === 'ja') {
    for(var i=0;i<voices.length;i++){
      var v=voices[i];
      if((v.lang==='ja-JP'||v.lang==='ja') && v.name.indexOf('Google')>=0) return v;
    }
    for(var i=0;i<voices.length;i++){
      var v=voices[i];
      if(v.lang==='ja-JP'||v.lang==='ja') return v;
    }
    return null;
  }

  if (shortLang === 'vi') {
    for(var i=0;i<voices.length;i++){
      var v=voices[i];
      if((v.lang==='vi-VN'||v.lang==='vi') && v.name.indexOf('Google')>=0) return v;
    }
    for(var i=0;i<voices.length;i++){
      var v=voices[i];
      if(v.lang==='vi-VN'||v.lang==='vi') return v;
    }
    return null;
  }

  for(var i=0;i<voices.length;i++){
    var v=voices[i];
    if(v.lang===fullLang && v.name.indexOf('Google')>=0) return v;
  }
  for(var i=0;i<voices.length;i++){
    var v=voices[i];
    if(v.lang===fullLang) return v;
  }
  for(var i=0;i<voices.length;i++){
    var v=voices[i];
    if(v.lang.startsWith(shortLang)) return v;
  }
  return null;
}

var playCount      = 0;
var MAX_PLAY       = 3;
var isMobile       = /Mobi|Android/i.test(navigator.userAgent);
var _currentViAudio = null;  // 이중 재생 방지용

// Google 베트남어 음성 탐색
function findGoogleViVoice() {
  var voices = speechSynthesis.getVoices();
  for (var i = 0; i < voices.length; i++) {
    var v = voices[i];
    if (v.lang.indexOf('vi') >= 0 && v.name.indexOf('Google') >= 0) return v;
  }
  return null;
}

// 모바일 전용: GAS proxy → Google TTS (북부 표준어)
function playViProxy(onDone) {
  if (!proxyUrl) { onDone(false); return; }
  setStatus('TTS 로딩 중...', 'ing');
  var url = proxyUrl + '?text=' + encodeURIComponent(cleaned) + '&lang=vi';
  fetch(url, {redirect: 'follow'})
    .then(function(r){
      if (!r.ok) throw new Error('fail');
      return r.text();
    })
    .then(function(base64){
      base64 = base64.trim().replace(/\s/g, '');
      if (!base64 || base64 === 'error') { onDone(false); return; }
      var bin = atob(base64);
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      var blob = new Blob([bytes], {type: 'audio/mpeg'});
      var audio = new Audio(URL.createObjectURL(blob));
      _currentViAudio = audio;  // 이중 재생 방지용 참조 저장
      document.getElementById('pronDisplay').textContent = 'Google TTS - 베트남 북부 표준어';
      function playNext(cnt) {
        if (cnt >= MAX_PLAY) { onDone(true); return; }
        setStatus((cnt+1)+' / '+MAX_PLAY+' 재생 중...', 'ing');
        audio.currentTime = 0;
        audio.onended = function(){ playNext(cnt+1); };
        audio.onerror = function(){ onDone(false); };
        audio.play().catch(function(){ onDone(false); });
      }
      playNext(0);
    })
    .catch(function(){ onDone(false); });
}

// Web Speech API 재생 (지정 voice 또는 자동 탐색)
function speak(forceVoice) {
  if (playCount >= MAX_PLAY) {
    setStatus('재생 완료 (' + MAX_PLAY + '회)', 'ok');
    if (auto && !isMobile) setTimeout(function(){ window.close(); }, 600);
    return;
  }
  playCount++;
  setStatus(playCount + ' / ' + MAX_PLAY + ' 재생 중...', 'ing');

  var utter = new SpeechSynthesisUtterance(cleaned);
  utter.lang  = m.full;
  utter.rate  = (ttsRate > 0) ? ttsRate : ((lang === 'zh' || lang === 'ja') ? 0.85 : 0.9);
  utter.pitch = 1.0;

  var voice = forceVoice || getBestVoice(m.full, lang);
  if (voice) {
    utter.voice = voice;
    document.getElementById('pronDisplay').textContent = voice.name;
  } else {
    document.getElementById('pronDisplay').textContent = m.full + ' (기본 음성)';
  }

  utter.onend  = function(){ speak(forceVoice); };
  utter.onerror = function(e){
    setStatus('오류: ' + e.error, 'err');
    if (e.error !== 'interrupted') speak(forceVoice);
  };
  speechSynthesis.speak(utter);
}

// 베트남어 재생 분기
// - 모바일: GAS proxy 우선 (탭 제스처 있음)
// - PC 자동: 버튼 클릭 유도 (Chrome 자동재생 차단 방지)
// - PC 클릭: Google 음성 또는 proxy 실행
function playVietnamese(fromUser) {
  var btn = document.getElementById('playBtn');

  if (isMobile) {
    playViProxy(function(ok){ if (!ok) speak(); });
    return;
  }

  // PC: Google 베트남어 음성 탐색
  var gVoice = findGoogleViVoice();
  if (gVoice) {
    btn.style.background = '';
    document.getElementById('pronDisplay').textContent = gVoice.name;
    speak(gVoice);
    return;
  }

  if (proxyUrl) {
    if (!fromUser) {
      // 자동 실행 → 버튼 클릭 유도 (audio.play() 자동재생 차단 방지)
      setStatus('▶ 버튼을 눌러 베트남어를 재생하세요', 'ing');
      document.getElementById('pronDisplay').textContent = 'Google TTS 준비 완료';
      btn.style.background = '#1B5E20';
      return;
    }
    // 사용자 클릭 → proxy 실행 (제스처 있어 audio.play() 허용)
    btn.style.background = '';
    playViProxy(function(ok){ if (!ok) speak(); });
  } else {
    speak();
  }
}

// fromUser: true = 버튼 직접 클릭, false/undefined = 자동 실행
function playNow(fromUser) {
  // 기존 Vietnamese proxy 오디오 강제 중지 (이중 재생 방지)
  if (_currentViAudio) { _currentViAudio.pause(); _currentViAudio = null; }
  speechSynthesis.cancel();
  playCount = 0;

  if (lang === 'vi') {
    playVietnamese(fromUser);
    return;
  }

  var voices = speechSynthesis.getVoices();
  if (voices.length === 0) {
    setStatus('음성 로딩 중...', 'ing');
    speechSynthesis.onvoiceschanged = function(){ speechSynthesis.onvoiceschanged=null; speak(); };
  } else {
    speak();
  }
}

window.addEventListener('load', function(){
  if (isMobile) {
    // body 클릭 리스너 제거 → 버튼 onclick만 사용 (이중 재생 방지)
    if (auto) setStatus('▶ 버튼을 눌러 재생하세요', 'ing');
    return;
  }
  if (auto) {
    setTimeout(function(){
      var voices = speechSynthesis.getVoices();
      if (voices.length > 0) { playNow(false); }
      else { speechSynthesis.onvoiceschanged = function(){ speechSynthesis.onvoiceschanged=null; playNow(false); }; }
    }, 400);
  }
});
</script>
</body>
</html>
