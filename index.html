<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>TTS</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#1a1a2e;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Malgun Gothic',Arial,sans-serif;}
    .card{background:#16213e;border-radius:18px;padding:28px 24px;text-align:center;max-width:340px;width:92%;box-shadow:0 8px 32px rgba(0,0,0,0.4);}
    .lang-badge{display:inline-block;padding:3px 12px;border-radius:20px;font-size:12px;font-weight:700;margin-bottom:14px;}
    .text-box{font-size:20px;color:#e8e8e8;margin:10px 0 6px;line-height:1.5;word-break:break-all;min-height:40px;}
    .pron{font-size:13px;color:#8899AA;margin-bottom:16px;}
    .btn{background:#0f3460;color:#fff;border:none;border-radius:12px;padding:13px 32px;font-size:15px;cursor:pointer;width:100%;transition:background 0.2s;}
    .btn:active{background:#1a5276;}
    .status{font-size:12px;margin-top:12px;height:18px;}
    .ok{color:#4CAF50;} .err{color:#EF5350;} .ing{color:#FFA726;}
  </style>
</head>
<body>
<div class="card">
  <div class="lang-badge" id="badge"></div>
  <div class="text-box" id="textDisplay"></div>
  <div class="pron" id="pronDisplay"></div>
  <button class="btn" id="playBtn" onclick="playNow()">&#9654; 발음 듣기</button>
  <div class="status" id="status"></div>
</div>
<script>
var p = new URLSearchParams(location.search);
var rawText = p.get('text') || '';
var lang    = p.get('lang') || 'ko';
var auto    = p.get('auto') === '1';

var decoded = '';
try { decoded = decodeURIComponent(rawText); } catch(e){ decoded = rawText; }

var META = {
  ko: {name:'한국어', full:'ko-KR', color:'#3F51B5', bg:'#E8EAF6'},
  vi: {name:'베트남어', full:'vi-VN', color:'#4CAF50', bg:'#E8F5E9'},
  en: {name:'영어',    full:'en-US', color:'#FF9800', bg:'#FFF3E0'},
  zh: {name:'중국어',  full:'zh-CN', color:'#F44336', bg:'#FFEBEE'},
  ja: {name:'일본어',  full:'ja-JP', color:'#9C27B0', bg:'#F3E5F5'}
};
var m = META[lang] || META.ko;

var badge = document.getElementById('badge');
badge.textContent = m.name;
badge.style.background = m.bg;
badge.style.color = m.color;

document.getElementById('textDisplay').textContent = decoded;

function setStatus(msg, cls){
  var el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status ' + (cls||'');
}

function getBestVoice(fullLang, shortLang) {
  var voices = speechSynthesis.getVoices();
  var best = null;

  // 중국어: zh-CN 우선, zh-TW 제외
  if (shortLang === 'zh') {
    // 1순위: Google 普通话
    for(var i=0;i<voices.length;i++){
      var v=voices[i];
      if((v.lang==='zh-CN'||v.lang==='zh') && v.name.indexOf('Google')>=0) return v;
    }
    // 2순위: 로컬 zh-CN
    for(var i=0;i<voices.length;i++){
      var v=voices[i];
      if(v.lang==='zh-CN') return v;
    }
    // 3순위: zh 포함 (TW 제외)
    for(var i=0;i<voices.length;i++){
      var v=voices[i];
      if(v.lang.indexOf('zh')>=0 && v.lang.indexOf('TW')<0) return v;
    }
    return null;
  }

  // 일본어
  if (shortLang === 'ja') {
    for(var i=0;i<voices.length;i++){
      var v=voices[i];
      if((v.lang==='ja-JP'||v.lang==='ja') && v.name.indexOf('Google')>=0) return v;
    }
    for(var i=0;i<voices.length;i++){
      var v=voices[i];
      if(v.lang==='ja-JP'||v.lang==='ja') return v;
    }
    return null;
  }

  // 베트남어
  if (shortLang === 'vi') {
    for(var i=0;i<voices.length;i++){
      var v=voices[i];
      if((v.lang==='vi-VN'||v.lang==='vi') && v.name.indexOf('Google')>=0) return v;
    }
    for(var i=0;i<voices.length;i++){
      var v=voices[i];
      if(v.lang==='vi-VN'||v.lang==='vi') return v;
    }
    return null;
  }

  // 한국어/영어 기본
  for(var i=0;i<voices.length;i++){
    var v=voices[i];
    if(v.lang===fullLang && v.name.indexOf('Google')>=0) return v;
  }
  for(var i=0;i<voices.length;i++){
    var v=voices[i];
    if(v.lang===fullLang) return v;
  }
  for(var i=0;i<voices.length;i++){
    var v=voices[i];
    if(v.lang.startsWith(shortLang)) return v;
  }
  return null;
}

var playCount = 0;
var MAX_PLAY = 3;

function speak() {
  if (playCount >= MAX_PLAY) {
    setStatus('재생 완료 (' + MAX_PLAY + '회)', 'ok');
    if (auto && !/Mobi|Android/i.test(navigator.userAgent)) {
      setTimeout(function(){ window.close(); }, 600);
    }
    return;
  }
  playCount++;
  setStatus((playCount) + ' / ' + MAX_PLAY + ' 재생 중...', 'ing');

  var cleaned = decoded.replace(/\([^)]*\)/g, "").replace(/\s{2,}/g, " ").trim();
  var utter = new SpeechSynthesisUtterance(cleaned);
  utter.lang = m.full;
  utter.rate = (lang === 'zh' || lang === 'ja') ? 0.85 : 0.9;
  utter.pitch = 1.0;

  var voice = getBestVoice(m.full, lang);
  if (voice) {
    utter.voice = voice;
    document.getElementById('pronDisplay').textContent = voice.name;
  } else {
    document.getElementById('pronDisplay').textContent = m.full + ' (기본 음성)';
  }

  utter.onend = function(){ speak(); };
  utter.onerror = function(e){
    setStatus('오류: ' + e.error, 'err');
    if (e.error !== 'interrupted') speak();
  };

  speechSynthesis.speak(utter);
}

function playNow() {
  speechSynthesis.cancel();
  playCount = 0;
  var voices = speechSynthesis.getVoices();
  if (voices.length === 0) {
    setStatus('음성 로딩 중...', 'ing');
    speechSynthesis.onvoiceschanged = function(){ speechSynthesis.onvoiceschanged=null; speak(); };
  } else {
    speak();
  }
}

// 자동 재생
window.addEventListener('load', function(){
  // 모바일: 탭 1회 탭으로 재생
  if (/Mobi|Android/i.test(navigator.userAgent)) {
    setStatus('화면을 탭하면 재생됩니다', 'ing');
    document.body.addEventListener('click', function(){ playNow(); }, {once:true});
    return;
  }
  // PC: 자동 재생
  if (auto) {
    setTimeout(function(){
      var voices = speechSynthesis.getVoices();
      if (voices.length > 0) { playNow(); }
      else { speechSynthesis.onvoiceschanged = function(){ speechSynthesis.onvoiceschanged=null; playNow(); }; }
    }, 400);
  }
});
</script>
</body>
</html>
