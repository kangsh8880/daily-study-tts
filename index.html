<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>TTS</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#1a1a2e;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Malgun Gothic',Arial,sans-serif;}
    .card{background:#16213e;border-radius:18px;padding:28px 24px;text-align:center;max-width:340px;width:92%;box-shadow:0 8px 32px rgba(0,0,0,0.4);}
    .lang-badge{display:inline-block;padding:3px 12px;border-radius:20px;font-size:12px;font-weight:700;margin-bottom:14px;}
    .text-box{font-size:20px;color:#e8e8e8;margin:10px 0 6px;line-height:1.5;word-break:break-all;min-height:40px;}
    .pron{font-size:12px;color:#8899AA;margin-bottom:16px;min-height:16px;}
    .btn{background:#0f3460;color:#fff;border:none;border-radius:12px;padding:13px 32px;font-size:15px;cursor:pointer;width:100%;transition:background 0.2s;}
    .btn:active{background:#1a5276;}
    .status{font-size:12px;margin-top:12px;height:18px;}
    .ok{color:#4CAF50;} .err{color:#EF5350;} .ing{color:#FFA726;}
  </style>
</head>
<body>
<div class="card">
  <div class="lang-badge" id="badge"></div>
  <div class="text-box" id="textDisplay"></div>
  <div class="pron" id="pronDisplay"></div>
  <button class="btn" id="playBtn" onclick="playNow()">&#9654; 발음 듣기</button>
  <div class="status" id="status"></div>
</div>
<script>
var p = new URLSearchParams(location.search);
var rawText  = p.get('text')  || '';
var lang     = p.get('lang')  || 'ko';
var auto     = p.get('auto')  === '1';
var proxyUrl = p.get('proxy') ? decodeURIComponent(p.get('proxy')) : '';

var decoded = '';
try { decoded = decodeURIComponent(rawText); } catch(e){ decoded = rawText; }

// 괄호() 안 텍스트 제거 후 TTS 읽기
function cleanText(t) {
  return t.replace(/\([^)]*\)/g, '').replace(/\s{2,}/g, ' ').trim();
}
var cleaned = cleanText(decoded);

var META = {
  ko:{name:'한국어', full:'ko-KR', color:'#3F51B5', bg:'#E8EAF6'},
  vi:{name:'베트남어', full:'vi-VN', color:'#4CAF50', bg:'#E8F5E9'},
  en:{name:'영어',    full:'en-US', color:'#FF9800', bg:'#FFF3E0'},
  zh:{name:'중국어',  full:'zh-CN', color:'#F44336', bg:'#FFEBEE'},
  ja:{name:'일본어',  full:'ja-JP', color:'#9C27B0', bg:'#F3E5F5'}
};
var m = META[lang] || META.ko;

var badge = document.getElementById('badge');
badge.textContent = m.name;
badge.style.background = m.bg;
badge.style.color = m.color;
document.getElementById('textDisplay').textContent = decoded;

function setStatus(msg, cls){
  var el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status ' + (cls||'');
}
function setPron(msg){ document.getElementById('pronDisplay').textContent = msg; }

// ── Web Speech API (한/영/중/일 및 베트남어 폴백) ──
function getBestVoice(fullLang, shortLang) {
  var voices = speechSynthesis.getVoices();
  if (shortLang === 'zh') {
    for(var i=0;i<voices.length;i++) if((voices[i].lang==='zh-CN'||voices[i].lang==='zh')&&voices[i].name.indexOf('Google')>=0) return voices[i];
    for(var i=0;i<voices.length;i++) if(voices[i].lang==='zh-CN') return voices[i];
    for(var i=0;i<voices.length;i++) if(voices[i].lang.indexOf('zh')>=0&&voices[i].lang.indexOf('TW')<0) return voices[i];
    return null;
  }
  if (shortLang === 'ja') {
    for(var i=0;i<voices.length;i++) if((voices[i].lang==='ja-JP'||voices[i].lang==='ja')&&voices[i].name.indexOf('Google')>=0) return voices[i];
    for(var i=0;i<voices.length;i++) if(voices[i].lang==='ja-JP'||voices[i].lang==='ja') return voices[i];
    return null;
  }
  for(var i=0;i<voices.length;i++) if(voices[i].lang===fullLang&&voices[i].name.indexOf('Google')>=0) return voices[i];
  for(var i=0;i<voices.length;i++) if(voices[i].lang===fullLang) return voices[i];
  for(var i=0;i<voices.length;i++) if(voices[i].lang.startsWith(shortLang)) return voices[i];
  return null;
}

var repeatCount = 0;
var MAX_REPEAT = 3;

function speakWeb(onDone) {
  if (repeatCount >= MAX_REPEAT) { if(onDone) onDone(); return; }
  repeatCount++;
  setStatus(repeatCount + ' / ' + MAX_REPEAT + ' 재생 중...', 'ing');

  var utter = new SpeechSynthesisUtterance(cleaned);
  utter.lang  = m.full;
  utter.rate  = (lang==='zh'||lang==='ja') ? 0.85 : 0.9;
  utter.pitch = 1.0;

  var voice = getBestVoice(m.full, lang);
  if (voice) { utter.voice = voice; setPron(voice.name); }
  else { setPron(m.full + ' (기본 음성)'); }

  utter.onend  = function(){ speakWeb(onDone); };
  utter.onerror = function(e){ if(e.error!=='interrupted') speakWeb(onDone); };
  speechSynthesis.speak(utter);
}

// ── 베트남어 GAS 프록시 (고품질 북부표준어) ──
function speakViProxy(proxyBase, onDone) {
  var url = proxyBase + '?text=' + encodeURIComponent(cleaned) + '&lang=vi';
  setStatus('고품질 음성 로딩 중...', 'ing');
  setPron('Google TTS (북부표준어)');

  fetch(url)
    .then(function(res){
      if(!res.ok) throw new Error('proxy_error');
      return res.text();
    })
    .then(function(base64){
      if(!base64 || base64 === 'error') throw new Error('empty');
      var binary = atob(base64);
      var bytes = new Uint8Array(binary.length);
      for(var i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
      var blob = new Blob([bytes], {type:'audio/mpeg'});
      var blobUrl = URL.createObjectURL(blob);

      var count = 0;
      function playOnce() {
        if(count >= MAX_REPEAT){ URL.revokeObjectURL(blobUrl); if(onDone) onDone(); return; }
        count++;
        setStatus(count + ' / ' + MAX_REPEAT + ' 재생 중...', 'ing');
        var audio = new Audio(blobUrl);
        audio.onended = function(){ playOnce(); };
        audio.onerror = function(){ URL.revokeObjectURL(blobUrl); fallbackWeb(onDone); };
        audio.play().catch(function(){ URL.revokeObjectURL(blobUrl); fallbackWeb(onDone); });
      }
      playOnce();
    })
    .catch(function(e){
      setPron('프록시 실패 → Web Speech API 전환');
      fallbackWeb(onDone);
    });
}

function fallbackWeb(onDone) {
  repeatCount = 0;
  speakWeb(onDone);
}

function onAllDone() {
  setStatus('재생 완료 (' + MAX_REPEAT + '회)', 'ok');
  if(auto && !/Mobi|Android/i.test(navigator.userAgent)) {
    setTimeout(function(){ window.close(); }, 600);
  }
}

function playNow() {
  speechSynthesis.cancel();
  repeatCount = 0;

  if (lang === 'vi' && proxyUrl) {
    // 베트남어 + 프록시 URL → GAS 고품질 TTS
    speakViProxy(proxyUrl, onAllDone);
  } else {
    // 그 외 (베트남어 프록시 없을 때 포함) → Web Speech API
    var voices = speechSynthesis.getVoices();
    if(voices.length === 0) {
      setStatus('음성 로딩 중...', 'ing');
      speechSynthesis.onvoiceschanged = function(){ speechSynthesis.onvoiceschanged=null; speakWeb(onAllDone); };
    } else {
      speakWeb(onAllDone);
    }
  }
}

window.addEventListener('load', function(){
  if(/Mobi|Android/i.test(navigator.userAgent)){
    setStatus('화면을 탭하면 재생됩니다', 'ing');
    document.body.addEventListener('click', function(){ playNow(); }, {once:true});
    return;
  }
  if(auto){
    setTimeout(function(){
      var v = speechSynthesis.getVoices();
      if(v.length>0){ playNow(); }
      else { speechSynthesis.onvoiceschanged = function(){ speechSynthesis.onvoiceschanged=null; playNow(); }; }
    }, 400);
  }
});
</script>
</body>
</html>
