<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>🔊</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI','Noto Sans KR',Arial,sans-serif;background:#F0F4F8;min-height:100vh;padding:16px}
#single{max-width:360px;margin:0 auto;padding-top:16px}
.card{background:#fff;border-radius:14px;box-shadow:0 4px 20px rgba(0,0,0,.1);padding:24px;text-align:center}
.flag{font-size:44px;margin-bottom:8px}
.lang-name{font-size:10px;font-weight:bold;color:#95A5A6;letter-spacing:1px;margin-bottom:6px;text-transform:uppercase}
.phrase{font-size:21px;font-weight:bold;color:#2C3E50;line-height:1.4;margin-bottom:20px;word-break:break-word}
.play-big{width:64px;height:64px;background:linear-gradient(135deg,#1E8449,#27AE60);border:none;border-radius:50%;color:#fff;font-size:26px;cursor:pointer;box-shadow:0 4px 12px rgba(39,174,96,.35);display:inline-flex;align-items:center;justify-content:center;transition:transform .1s}
.play-big:active{transform:scale(.93)}
.play-big.playing{background:linear-gradient(135deg,#117A65,#1ABC9C)}
.status{font-size:11px;color:#7F8C8D;margin-top:10px;min-height:18px}
.voice-info{font-size:10px;color:#BDC3C7;margin-top:6px}
.wave-wrap{display:none;width:80px;height:80px;margin:0 auto 12px;position:relative}
.wave-wrap.on{display:block}
.wave-wrap span{position:absolute;border:2px solid #27AE60;border-radius:50%;animation:rpl 1.4s ease-out infinite;opacity:0}
.wave-wrap span:nth-child(1){width:44px;height:44px;top:18px;left:18px;animation-delay:0s}
.wave-wrap span:nth-child(2){width:62px;height:62px;top:9px;left:9px;animation-delay:.35s}
.wave-wrap span:nth-child(3){width:80px;height:80px;top:0;left:0;animation-delay:.7s}
@keyframes rpl{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1);opacity:0}}
/* 전체문장 모드 */
.header{background:linear-gradient(135deg,#1A3A5C,#2980B9);border-radius:12px;padding:16px 20px;margin-bottom:14px;color:#fff;text-align:center}
.header h1{font-size:17px;font-weight:bold;margin-bottom:2px}
.header p{font-size:11px;opacity:.75}
.ctrl{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:12px}
.ctrl label{font-size:12px;color:#555}
.ctrl input[type=range]{width:100px;accent-color:#2980B9}
.sv{font-size:12px;color:#2980B9;font-weight:bold;min-width:30px}
.pa-btn{display:block;width:100%;padding:10px;margin-bottom:10px;background:linear-gradient(135deg,#1E8449,#27AE60);color:#fff;border:none;border-radius:9px;font-size:13px;font-weight:bold;cursor:pointer;box-shadow:0 3px 8px rgba(39,174,96,.28)}
.pa-btn:disabled{opacity:.5;cursor:not-allowed}
.sb{text-align:center;font-size:11px;color:#7F8C8D;padding:5px;min-height:18px;margin-bottom:6px}
.pcard{background:#fff;border-radius:9px;box-shadow:0 2px 7px rgba(0,0,0,.07);margin-bottom:10px;overflow:hidden}
.pcard-num{background:#EBF5FB;padding:5px 13px;font-size:10px;font-weight:bold;color:#1A5276;letter-spacing:.4px}
.lr{display:flex;align-items:center;gap:9px;padding:8px 13px;border-bottom:1px solid #F0F4F8;cursor:pointer;transition:background .12s}
.lr:last-child{border-bottom:none}
.lr:hover{background:#F8FBFE}
.lr.playing{background:#EBF5FB}
.lb{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.li{flex:1;min-width:0}
.ll{font-size:9px;color:#95A5A6;font-weight:bold;margin-bottom:1px}
.lt{font-size:13px;font-weight:500;word-break:break-word}
.lrm{font-size:10px;color:#7F8C8D;margin-top:1px}
.lg-btn{width:30px;height:30px;border:none;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.lg-btn:active{transform:scale(.9)}
</style>
</head>
<body>
<div id="root"></div>
<script>
var synth = window.speechSynthesis;
var params = new URLSearchParams(location.search);
var root = document.getElementById('root');

var META = {
  'ko-KR':{label:'한국어',   flag:'🇰🇷', color:'#2C3E50', bg:'#F8F9FA'},
  'vi-VN':{label:'베트남어', flag:'🇻🇳', color:'#1A6B9A', bg:'#EBF5FB'},
  'en-US':{label:'영어',     flag:'🇺🇸', color:'#27AE60', bg:'#F0FAF4'},
  'zh-CN':{label:'중국어',   flag:'🇨🇳', color:'#C0392B', bg:'#FEF9F9'},
  'ja-JP':{label:'일본어',   flag:'🇯🇵', color:'#7D3C98', bg:'#F8F4FD'}
};

/* ══════════════════════════════════════════════
   베트남어 최적 음성 선택
   우선순위: Natural > Google > Microsoft > Linh > Female > any
   베트남어 특성: rate 0.9, pitch 1.1 (남부 억양에 가깝게)
══════════════════════════════════════════════ */
function getBestVoice(bcp) {
  var voices = synth.getVoices();
  var lang = bcp.split('-')[0]; // 'vi', 'ko', 'en' 등

  // 해당 언어 음성만 필터
  var pool = voices.filter(function(v) {
    return v.lang === bcp || v.lang.startsWith(lang + '-') || v.lang.startsWith(lang + '_');
  });

  if (pool.length === 0) {
    // 정확한 매칭 없을 경우 lang 코드만으로 재시도
    pool = voices.filter(function(v) { return v.lang.toLowerCase().startsWith(lang); });
  }

  if (pool.length === 0) return null;

  // 베트남어 전용 우선순위
  if (lang === 'vi') {
    return pool.find(function(v){ return /Natural/i.test(v.name); }) ||
           pool.find(function(v){ return /Google/i.test(v.name); }) ||
           pool.find(function(v){ return /Microsoft.*Linh/i.test(v.name); }) ||
           pool.find(function(v){ return /Microsoft/i.test(v.name); }) ||
           pool.find(function(v){ return /female|woman|girl/i.test(v.name); }) ||
           pool[pool.length - 1]; // 마지막 항목(보통 더 나은 품질)
  }

  // 그 외 언어 일반 우선순위
  return pool.find(function(v){ return /Natural/i.test(v.name); }) ||
         pool.find(function(v){ return /Google/i.test(v.name); }) ||
         pool.find(function(v){ return /Microsoft/i.test(v.name); }) ||
         pool[0];
}

/* 언어별 TTS 파라미터 */
var TTS_PARAMS = {
  'ko-KR': { rate: 1.0, pitch: 1.0 },
  'vi-VN': { rate: 0.9, pitch: 1.05 }, // 베트남어: 약간 느리고 음조 살짝 높게
  'en-US': { rate: 1.0, pitch: 1.0 },
  'zh-CN': { rate: 0.95, pitch: 1.0 },
  'ja-JP': { rate: 1.0, pitch: 1.0 }
};

/* ══════════════════════════════════════════════
   모드A: 단일 언어 자동재생
══════════════════════════════════════════════ */
var sText = params.get('text');
var sLang = params.get('lang');

if (sText && sLang) {
  var decoded = decodeURIComponent(sText);
  var meta = META[sLang] || {label:sLang, flag:'🌐', color:'#2C3E50', bg:'#F8F9FA'};
  var ttsP = TTS_PARAMS[sLang] || {rate:1.0, pitch:1.0};
  document.title = meta.flag + ' ' + decoded;

  root.innerHTML =
    '<div id="single"><div class="card">' +
    '<div class="wave-wrap" id="ww"><span></span><span></span><span></span></div>' +
    '<div class="flag">' + meta.flag + '</div>' +
    '<div class="lang-name">' + meta.label + '</div>' +
    '<div class="phrase">' + decoded + '</div>' +
    '<button class="play-big" id="bigBtn" onclick="doSpeak()">🔊</button>' +
    '<div class="status" id="sts">준비 중...</div>' +
    '<div class="voice-info" id="vinfo"></div>' +
    '</div></div>';

  var sts   = document.getElementById('sts');
  var vinfo = document.getElementById('vinfo');
  var btn   = document.getElementById('bigBtn');
  var ww    = document.getElementById('ww');
  var spoke = false;

  function doSpeak() {
    if (!synth) { sts.textContent = 'TTS 미지원 브라우저'; return; }
    synth.cancel();
    var u = new SpeechSynthesisUtterance(decoded);
    u.lang  = sLang;
    u.rate  = ttsP.rate;
    u.pitch = ttsP.pitch;
    u.volume = 1.0;

    // 최적 음성 선택
    var bestVoice = getBestVoice(sLang);
    if (bestVoice) {
      u.voice = bestVoice;
      vinfo.textContent = '음성: ' + bestVoice.name;
    }

    btn.classList.add('playing');
    ww.classList.add('on');
    sts.textContent = '🔊 재생 중...';

    u.onstart = function() { spoke = true; };
    u.onend   = function() {
      btn.classList.remove('playing');
      ww.classList.remove('on');
      sts.textContent = '완료';
      window.close(); // 즉시 닫기
    };
    u.onerror = function() {
      btn.classList.remove('playing');
      ww.classList.remove('on');
      sts.textContent = '다시 눌러주세요';
    };
    synth.speak(u);
  }
  window.doSpeak = doSpeak;

  // 자동재생 (3단계)
  function tryAuto() {
    if (spoke) return;
    if (synth.getVoices().length > 0) {
      doSpeak();
    } else {
      synth.onvoiceschanged = function() { if (!spoke) doSpeak(); };
      setTimeout(function() { if (!spoke) doSpeak(); }, 500);
    }
  }

  if (document.readyState === 'complete') { tryAuto(); }
  else { window.addEventListener('load', tryAuto); setTimeout(tryAuto, 100); }

} else {

/* ══════════════════════════════════════════════
   모드B: 전체 문장 목록
══════════════════════════════════════════════ */
  var dl = params.get('date') || '';
  var LANGS = [
    {key:'kr', rom:null,  bcp:'ko-KR', ...META['ko-KR']},
    {key:'vn', rom:'vnr', bcp:'vi-VN', ...META['vi-VN']},
    {key:'en', rom:null,  bcp:'en-US', ...META['en-US']},
    {key:'cn', rom:'cnr', bcp:'zh-CN', ...META['zh-CN']},
    {key:'jp', rom:'jpr', bcp:'ja-JP', ...META['ja-JP']}
  ];
  var phrases = [];
  for (var i = 1; i <= 5; i++) {
    var r = params.get('p'+i);
    if (!r) continue;
    try { phrases.push(JSON.parse(decodeURIComponent(r))); } catch(e) {}
  }

  root.innerHTML =
    '<div class="header"><h1>📢 5개국어 발음 듣기</h1><p>'+(dl||'자동 언어 발음 재생')+'</p></div>'+
    '<div class="ctrl"><label>⏱ 속도</label><input type="range" id="spd" min="0.5" max="1.5" step="0.1" value="1.0"><span class="sv" id="sv">1.0×</span></div>'+
    '<button class="pa-btn" id="paBtn">▶ 전체 순서대로 재생</button>'+
    '<div class="sb" id="sb">버튼을 클릭하거나 전체 재생을 눌러보세요</div>'+
    '<div id="cards"></div>';

  document.getElementById('spd').addEventListener('input', function(){
    document.getElementById('sv').textContent = parseFloat(this.value).toFixed(1) + '×';
  });

  var allRows=[], curRow=null;
  var cards = document.getElementById('cards');
  var sb    = document.getElementById('sb');

  function spk(text, bcp, rowEl, cb) {
    synth.cancel();
    if (curRow) curRow.classList.remove('playing');
    curRow = rowEl; if (rowEl) rowEl.classList.add('playing');
    var u = new SpeechSynthesisUtterance(text);
    var p = TTS_PARAMS[bcp] || {rate:1.0, pitch:1.0};
    u.lang   = bcp;
    u.rate   = parseFloat(document.getElementById('spd').value) * (p.rate);
    u.pitch  = p.pitch;
    var bv = getBestVoice(bcp);
    if (bv) u.voice = bv;
    u.onend = u.onerror = function() {
      if (rowEl) rowEl.classList.remove('playing');
      curRow = null; if (cb) cb();
    };
    synth.speak(u);
    sb.textContent = '재생 중: ' + text;
  }

  if (phrases.length === 0) {
    cards.innerHTML = '<div style="text-align:center;color:#95A5A6;padding:28px">이메일에서 🔊 버튼을 클릭하세요</div>';
  } else {
    phrases.forEach(function(p, idx) {
      var card = document.createElement('div'); card.className = 'pcard';
      var num  = document.createElement('div'); num.className = 'pcard-num';
      num.textContent = (idx+1) + '번 문장'; card.appendChild(num);
      LANGS.forEach(function(lang) {
        var text = p[lang.key]||'', roman = lang.rom?(p[lang.rom]||''):'';
        if (!text) return;
        var row = document.createElement('div'); row.className = 'lr';
        row.innerHTML =
          '<div class="lb" style="background:'+lang.bg+'">'+lang.flag+'</div>'+
          '<div class="li"><div class="ll">'+lang.label+'</div>'+
          '<div class="lt" style="color:'+lang.color+'">'+text+'</div>'+
          (roman?'<div class="lrm">'+roman+'</div>':'')+'</div>'+
          '<button class="lg-btn" style="background:'+lang.bg+';color:'+lang.color+'">🔊</button>';
        allRows.push({text:text, bcp:lang.bcp, rowEl:row});
        var b = row.querySelector('.lg-btn');
        b.addEventListener('click', function(e){ e.stopPropagation(); spk(text, lang.bcp, row); });
        row.addEventListener('click', function(){ b.click(); });
        card.appendChild(row);
      });
      cards.appendChild(card);
    });
  }

  var paBtn = document.getElementById('paBtn'), paActive=false, paIdx=0;
  function playNext() {
    if (!paActive || paIdx >= allRows.length) {
      paBtn.disabled=false; paBtn.textContent='▶ 전체 순서대로 재생';
      sb.textContent='재생 완료!'; paActive=false; return;
    }
    var e = allRows[paIdx++];
    spk(e.text, e.bcp, e.rowEl, function(){ setTimeout(playNext, 250); });
  }
  paBtn.addEventListener('click', function() {
    if (paActive) { synth.cancel(); paActive=false; paBtn.textContent='▶ 전체 순서대로 재생'; return; }
    paIdx=0; paActive=true; paBtn.textContent='⏹ 정지'; playNext();
  });
}

window.addEventListener('beforeunload', function(){ synth && synth.cancel(); });
</script>
</body>
</html>
